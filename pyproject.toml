[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "engramkeep"
version = "0.2.0"
description = "Local-first, Markdown-native persistent memory for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "The Engramkeep Contributors" }]
keywords = ["ai", "agents", "memory", "mcp", "markdown", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "twine>=5.0",
]

[project.scripts]
engramkeep = "engramkeep.cli:main"
engram = "engramkeep.cli:main"

[project.urls]
Homepage = "https://github.com/engramkeep/engramkeep"
Documentation = "https://github.com/engramkeep/engramkeep/tree/main/docs"
Issues = "https://github.com/engramkeep/engramkeep/issues"
Changelog = "https://github.com/engramkeep/engramkeep/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/engramkeep"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["engramkeep"]
